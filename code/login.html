<!DOCTYPE html>
<html>
<head>
<title>GramSetu - Login</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
margin:0;
}

.header{
background:#2e7d32;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
text-align:center;
}

.container{
width:400px;
margin:60px auto;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#2e7d32;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:8px;
margin-top:5px;
border:1px solid #ccc;
border-radius:4px;
}

button{
margin-top:20px;
width:100%;
padding:10px;
background:#2e7d32;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#256528;
}

</style>

</head>

<body>

<div class="header">
🌾 GramSetu
</div>

<div class="container">

<h2>Login</h2>

<form id="loginForm">

<label>Phone Number</label>
<input type="tel" id="mobile" required>

<label>Password</label>
<input type="password" id="password" required>

<button type="submit">Login</button>

</form>

<p id="msg"></p>

</div>

<script>

const region = "ap-south-1";
const clientId = "44v22jc2gsnjdhr77cnpeebk0u";
const clientSecret = "1rh54i5mk5ea7n89lq6a7m99p4mta5votnu2dia0mhf72itgpln8";

async function generateSecretHash(username){

const encoder = new TextEncoder();

const key = await crypto.subtle.importKey(
"raw",
encoder.encode(clientSecret),
{name:"HMAC",hash:"SHA-256"},
false,
["sign"]
);

const message = encoder.encode(username + clientId);

const signature = await crypto.subtle.sign("HMAC",key,message);

return btoa(String.fromCharCode(...new Uint8Array(signature)));

}

document.getElementById("loginForm").addEventListener("submit", async function(e){

e.preventDefault();

let mobile = document.getElementById("mobile").value;
let password = document.getElementById("password").value;

let username = mobile;

const secretHash = await generateSecretHash(username);

try{

let response = await fetch(`https://cognito-idp.${region}.amazonaws.com/`,{

method:"POST",

headers:{
"Content-Type":"application/x-amz-json-1.1",
"X-Amz-Target":"AWSCognitoIdentityProviderService.InitiateAuth"
},

body:JSON.stringify({

AuthFlow:"USER_PASSWORD_AUTH",

ClientId:clientId,

AuthParameters:{
USERNAME:username,
PASSWORD:password,
SECRET_HASH:secretHash
}

})

});

let data = await response.json();

if(data.AuthenticationResult){

document.getElementById("msg").innerText="Login successful";

localStorage.setItem("accessToken",data.AuthenticationResult.AccessToken);

const userId = "91" + mobile;

let userResponse = await fetch(
"https://ubtkqscvjb.execute-api.ap-south-1.amazonaws.com/users?user_id=" + userId
);

let userData = await userResponse.json();

console.log(userData);

if(userData.role === "customer"){
window.location.href="customer.html";
}
else if(userData.role === "farmer"){
window.location.href="farmer.html";
}
else{
document.getElementById("msg").innerText="User role not found";
}

}


else{

document.getElementById("msg").innerText="Invalid login";

}

console.log(data);

}catch(err){

document.getElementById("msg").innerText="Login error";
console.log(err);

}

});

</script>

</body>
</html>
